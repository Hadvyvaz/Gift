<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Food Box</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #ffd6e7;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        
        .scene {
            position: relative;
            width: 300px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .box-container {
            perspective: 1000px;
            position: absolute;
            z-index: 2;
        }
        
        .box {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: float 4s ease-in-out infinite, rotate 10s linear infinite;
            cursor: pointer;
            transition: transform 0.5s ease;
        }
        
        .box-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #cfb095 0%, #a67b5b 100%);
            border: 2px solid #a67b5b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            backface-visibility: visible;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }
        
        .front { transform: translateZ(100px); }
        .back { transform: rotateY(180deg) translateZ(100px); }
        .top { 
            transform: rotateX(90deg) translateZ(100px); 
            background: linear-gradient(135deg, #bcaaa4 0%, #8d6e63 100%);
        }
        .bottom { 
            transform: rotateX(-90deg) translateZ(100px); 
            background: linear-gradient(135deg, #8d6e63 0%, #5d4037 100%);
        }
        .left { transform: rotateY(-90deg) translateZ(100px); }
        .right { transform: rotateY(90deg) translateZ(100px); }
        
        .lid {
            position: absolute;
            width: 100%;
            height: 20px;
            background: linear-gradient(135deg, #a1887f 0%, #8d6e63 100%);
            top: -20px;
            transform-origin: bottom;
            transition: transform 1s ease;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        
        .box.open {
            animation: none;
            transform: translateY(0) scale(1.1);
        }
        
        .box.open .lid {
            transform: rotateX(-120deg);
        }
        
        .food-container {
            position: absolute;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            opacity: 0;
            transform: translateY(20px) scale(0.8);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .food-container.reveal {
            opacity: 1;
            transform: translateY(-140px) scale(1.2);
        }
        
        .food {
            font-size: 80px;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.2));
            animation: food-bounce 2s ease infinite;
        }
        
        .message {
            color: #ff9ec6;
            font-family: Arial, sans-serif;
            font-size: 24px;
            text-align: center;
            margin: 20px 0;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
            max-width: 300px;
            line-height: 1.4;
        }
        
        .message.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        
        .buttons.show {
            opacity: 1;
        }
        
        button {
            background-color: #ff85b0;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        button:hover {
            background-color: #ff5c93;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #ff5c93;
            opacity: 0;
            pointer-events: none;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(0) rotateY(0); }
            50% { transform: translateY(-80px) rotateX(5deg) rotateY(5deg); }
        }
        
        @keyframes rotate {
            0% { transform: rotateY(0); }
            100% { transform: rotateY(360deg); }
        }
        
        @keyframes food-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        @keyframes confetti-fall {
            10% { 
                transform: translateY(-10) rotate(0); 
                opacity: 1;
            }
            100% { 
                transform: translateY(100vh) rotate(720deg); 
                opacity: 0;
            }
        }
        
        @media (max-width: 600px) {
            .scene {
                height: 300px;
            }
            
            .box {
                width: 150px;
                height: 150px;
            }
            
            .front { transform: translateZ(75px); }
            .back { transform: rotateY(180deg) translateZ(75px); }
            .top { transform: rotateX(90deg) translateZ(75px); }
            .bottom { transform: rotateX(-90deg) translateZ(75px); }
            .left { transform: rotateY(-90deg) translateZ(75px); }
            .right { transform: rotateY(90deg) translateZ(75px); }
            
            .food {
                font-size: 80px;
            }
            
            .food-container.reveal {
                transform: translateY(-110px) scale(1.2);
            }
            
            .message {
                font-size: 20px;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
  <div id="confetti-container"></div>
  <br><br>
  
  <div class="container">
        <div class="scene">
            <div class="box-container">
                <div class="box">
                    <div class="lid"></div>
                    <div class="box-face front">🎁</div>
                    <div class="box-face back">🎁</div>
                    <div class="box-face top"></div>
                    <div class="box-face bottom"></div>
                    <div class="box-face left">🎁</div>
                    <div class="box-face right">🎁</div>
                </div>
            </div>
            <div class="food-container">
                <div class="food">❓</div>
            </div>
        </div>
        
        <div class="message">You've worked a lot today. Please eat something now.</div>
        
        <div class="buttons">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
        
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const box = document.querySelector('.box');
            const foodContainer = document.querySelector('.food-container');
            const food = document.querySelector('.food');
            const message = document.querySelector('.message');
            const buttons = document.querySelector('.buttons');
            const yesBtn = document.getElementById('yes-btn');
            const noBtn = document.getElementById('no-btn');
            const confettiContainer = document.getElementById('confetti-container');
            
            // Food emojis array
            const foodEmojis = ['🥧' '🍫' , '🍖', '🍞', '🥨', '🥞', '🧆', '🥙', '🌯', '🍲', '🍙', '🍜', '🍥', '🍡', '🍨', '🍮', '🥐', '🍔'];
            
            let boxOpened = false;
            
            // Function to get a random food emoji
            function getRandomFood() {
                const randomIndex = Math.floor(Math.random() * foodEmojis.length);
                return foodEmojis[randomIndex];
            }
            
            // Open box on click
            box.addEventListener('click', function() {
                if (boxOpened) return;
                
                boxOpened = true;
                
                // Stop the box animation and open it
                box.classList.add('open');
                
                // Set random food emoji
                const randomFood = getRandomFood();
                food.textContent = randomFood;
                
                // Animate food emerging from the box
                setTimeout(() => {
                    foodContainer.classList.add('reveal');
                    
                    // Show message and buttons
                    setTimeout(() => {
                        message.classList.add('show');
                        buttons.classList.add('show');
                    }, 1000);
                }, 800);
            });
            
            // Confetti animation function
            function createConfetti() {
                for (let i = 0; i < 100; i++) {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 70%)`;
                    confetti.style.animation = `confetti-fall ${Math.random() * 3 + 2}s linear forwards`;
                    confettiContainer.appendChild(confetti);
                }
                
                // Remove confetti after animation
                setTimeout(() => {
                    confettiContainer.innerHTML = '';
                }, 5000);
            }
            
            // Yes button click
            yesBtn.addEventListener('click', function() {
                createConfetti();
                showFinalMessage();
                hideButtons();
            });
            
            // No button click
            noBtn.addEventListener('click', function() {
                noBtn.textContent = 'absolutely yes 🥺';
                noBtn.removeEventListener('click', arguments.callee);
                noBtn.addEventListener('click', function() {
                    createConfetti();
                    showFinalMessage();
                    hideButtons();
                });
            });
            
            // Show final message
            function showFinalMessage() {
                const finalMessage = document.createElement('div');
                finalMessage.classList.add('message', 'show');
                finalMessage.textContent = 'Yay! I love you';
                finalMessage.style.color = '#ff5c93';
                finalMessage.style.fontWeight = 'bold';
                finalMessage.style.marginTop = '20px';
                buttons.parentNode.insertBefore(finalMessage, buttons.nextSibling);
            }
            
            // Hide buttons after selection
            function hideButtons() {
                yesBtn.style.display = 'none';
                noBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
